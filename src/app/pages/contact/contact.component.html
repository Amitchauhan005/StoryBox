<section class="container-fluid px-3 py-5 bg-black">
  <div class="row justify-content-center g-4 align-items-stretch">
 
    <!-- ── CONTACT CARD ── -->
    <div class="col-12 col-md-4 card-col">
      <div class="glass-card contact-card w-100">
 
        <h1 class="fw-bold text-white mb-4">
          How can we <br> help you?
        </h1>
 
        <p class="text-secondary mb-4" style="max-width: 500px;">
          Our team is here to help you with any questions, support, or feedback.
          Reach out anytime — we'll respond as quickly as possible.
        </p>
 
        <button class="btn btn-light rounded-pill px-4 py-2 fw-semibold mb-5">
          Search FAQs
        </button>
 
        <hr class="text-secondary opacity-25">
 
        <h2 class="fw-bold text-white-soft text-center section-heading">Let's get in touch.</h2>
 
        <ul class="contact-list">
          <li><i class="bi bi-telephone-fill"></i> <span>+91 82354 32673</span></li>
          <li><i class="bi bi-instagram"></i> <span>Instagram</span></li>
          <li><i class="bi bi-facebook"></i> <span>Facebook</span></li>
          <li><i class="bi bi-linkedin"></i> <span>LinkedIn</span></li>
        </ul>
 
        <hr class="text-secondary opacity-25 mt-auto">
 
      </div>
    </div>
 
    <!-- ── FORM CARD ── -->
    <div class="col-12 col-md-6 card-col">
      <div class="glass-card form-card w-100">
 
        <div class="mb-4">
          <label class="form-label">Name<span class="required-star">*</span></label>
          <input type="text" class="glass-input" placeholder="Your Name">
        </div>
 
        <div class="mb-4">
          <label class="form-label">Email<span class="required-star">*</span></label>
          <input type="email" class="glass-input" placeholder="Your Email">
        </div>
 
        <div class="mb-4">
          <label class="form-label">Contact Number<span class="required-star">*</span></label>
          <input type="text" class="glass-input" placeholder="Your Contact Number">
        </div>
 
        <div class="mb-4">
          <label class="form-label">Comment<span class="required-star">*</span></label>
          <textarea class="glass-input" rows="4" placeholder="How can we help you?"></textarea>
        </div>
 
        <div class="d-flex justify-content-end mt-auto">
          <button class="btn-gradient-border">SUBMIT</button>
        </div>
 
      </div>
    </div>
 
  </div>
</section>
