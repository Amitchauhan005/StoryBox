<!-- HEADER -->
<header>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark px-2 px-md-4 custom-navbar flex-nowrap" >

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center" (click)="toggleMenu()">
      <img src="mainLogo.9b0103f3.png" width="40" height="40" class="me-2">
      <span class="brand-text d-none d-sm-inline">Storybox</span>
      <span class="brand-text d-inline d-sm-none">SB</span>
    </a>

    <!-- Desktop & Mobile Menu - Always visible but wraps -->
    <ul class="navbar-nav flex-row flex-wrap mx-2 mx-lg-auto">
      <li class="nav-item">
        <a (click)="goHome()" class="nav-link text-white px-1 px-sm-2 px-xl-3">Home</a>
      </li>
      <li class="nav-item">
        <a (click)="goAbout()" class="nav-link text-white px-1 px-sm-2 px-xl-3">About</a>
      </li>
      <li class="nav-item">
        <a (click)="goContact()" class="nav-link text-white px-1 px-sm-2 px-xl-3">Contact</a>
      </li>
      <li class="nav-item">
        <a (click)="goSubscription()" class="nav-link text-white px-1 px-sm-2 px-xl-3">Subscription</a>
      </li>
      <li class="nav-item">
        <a (click)="goShortVideos()" class="nav-link text-white px-1 px-sm-2 px-xl-3">Shorts</a>
      </li>
    </ul>

    <!-- Right Side -->
    <aside class="ms-auto d-flex align-items-center gap-1 gap-sm-2 gap-md-3 flex-nowrap">

      <!-- Search -->
      <div class="d-flex align-items-center position-relative">
        <input
          type="text"
          class="search-input form-control py-1"
          [ngClass]="{'active': searchOpen}"
          placeholder="Search...">
        <i class="fa fa-search text-white search-icon"
           (click)="toggleSearch()"></i>
      </div>

      <!-- Reward Button -->
      <button class="btn reward-btn d-flex align-items-center gap-1 px-2 px-sm-3 py-1" routerLink="/reward">
        <i class="fa-solid fa-crown"></i>
        <span class="d-none d-sm-inline">Reward</span>
      </button>

<button
  *ngIf="!isLoggedIn"
  class="btn sign-btn d-flex align-items-center gap-1 px-2 px-sm-3 py-1"
  (click)="goToLogin()">
  <i class="fa-solid fa-user d-block d-sm-none"></i>
  <span class="d-none d-sm-inline">Sign In</span>
</button>

<button
  *ngIf="isLoggedIn"
  class="btn sign-btn d-flex align-items-center gap-1 px-2 px-sm-3 py-1"
  (click)="onLogout()">
  <i class="fa-solid fa-right-from-bracket d-block d-sm-none"></i>
  <span class="d-none d-sm-inline">Logout</span>
</button>

    </aside>

  </nav>

</header>
